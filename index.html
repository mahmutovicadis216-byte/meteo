
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meteo Postaja Adis.M</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #007acc;
        }
        .data-box {
            background: white;
            box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
            border-radius: 10px;
            padding: 20px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .data-item {
            font-size: 1.2rem;
            margin: 10px 0;
        }
        .label {
            font-weight: 600;
            color: #555;
        }
        .value {
            font-weight: 700;
            font-size: 1.4rem;
            color: #007acc;
        }
        #refreshInfo {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
        }
        button {
            margin-top: 20px;
            background-color: #007acc;
            border: none;
            color: white;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        button:hover {
            background-color: #005a99;
        }
    </style>
</head>
<body>
    <header>Meteo Postaja Adis.M</header>
    <div class="data-box">
        <div class="data-item"><span class="label">Temperatura:</span> <span id="temp" class="value">- °C</span></div>
        <div class="data-item"><span class="label">Vlaga:</span> <span id="humidity" class="value">- %</span></div>
        <div class="data-item"><span class="label">Tlak zraka:</span> <span id="pressure" class="value">- hPa</span></div>
        <div class="data-item"><span class="label">Svjetlost:</span> <span id="light" class="value">- lx</span></div>
        <div class="data-item"><span class="label">Status/prognoza:</span> <span id="status" class="value">-</span></div>
        <div class="data-item"><span class="label">Zadnje mjerenje:</span> <span id="lastUpdate" class="value">-</span></div>
        <div id="refreshInfo">Podaci se osvježavaju svakih 15 sekundi.</div>
        <button id="btnRadar">Otvori Windy radar za Šentvid pri Stični</button>
    </div>

<script>
    const apiReadKey = "5U6UB8VY5OG8ZOB1";
    const channelID = "3591201";
    const windyLat = 45.950;
    const windyLon = 14.843;

    async function fetchData() {
        try {
            const url =https:'//api.thingspeak.com/channels/3591201/feeds.json?api_key=5U8UUBY5WSG8ZOB1&results=1';
            const response = await fetch(url);
            const data = await response.json();
            if (data && data.feeds && data.feeds.length > 0) {
                const feed = data.feeds[0];
                document.getElementById('temp').textContent = feed.field1 ? `${parseFloat(feed.field1).toFixed(1)} °C` : '- °C';
                document.getElementById('humidity').textContent = feed.field2 ? `${parseFloat(feed.field2).toFixed(1)} %` : '- %';
                document.getElementById('pressure').textContent = feed.field3 ? `${parseFloat(feed.field3).toFixed(1)} hPa` : '- hPa';
                document.getElementById('light').textContent = feed.field4 ? `${parseFloat(feed.field4).toFixed(0)} lx` : '- lx';
                
                const statusMap = {
                    'SUNCE': 'Sunce',
                    'OBLACNO': 'Oblačno',
                    'KISA_RADAR_VRTI': 'Kiša (radar se vrti)',
                    'KISA_RADAR_MIRUJE': 'Kiša (radar miruje)',
                    'SNIJEG': 'Snijeg'
                };
                let statusText = feed.field5 && statusMap[feed.field5.toUpperCase()] ? statusMap[feed.field5.toUpperCase()] : '-';
                document.getElementById('status').textContent = statusText;

                let lastTime = feed.created_at;
                if (lastTime) {
                    let dt = new Date(lastTime);
                    document.getElementById('lastUpdate').textContent = dt.toLocaleString('hr-HR', {
                        timeZone: 'Europe/Ljubljana',
                        year: 'numeric', month: '2-digit', day: '2-digit',
                        hour: '2-digit', minute: '2-digit', second: '2-digit'
                    });
                } else {
                    document.getElementById('lastUpdate').textContent = '-';
                }
            }
        } catch (error) {
            console.error('Greška pri dohvaćanju podataka:', error);
        }
    }

    document.getElementById('btnRadar').addEventListener('click', () => {
        const windyUrl = `https://www.windy.com/${windyLat}/${windyLon}/radar`;
        window.open(windyUrl, '_blank');
    });

    fetchData();
    setInterval(fetchData, 15000);
</script>
</body>
</html>
