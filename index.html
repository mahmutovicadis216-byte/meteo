<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#08121e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Meteo Postaja</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 18%, #102a42 0%, #07111d 55%, #040911 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      user-select: none;
    }
    .app-container {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* RADAR SEKCIJA */
    .radar-section {
      position: relative;
      width: 240px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 6px;
    }
    .radar-box {
      position: relative;
      width: 196px;
      height: 196px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.16) 0%, rgba(13, 148, 136, 0.08) 65%, rgba(6, 78, 59, 0.35) 100%);
      border: 2px solid rgba(45, 212, 191, 0.55);
      box-shadow: 0 0 35px rgba(45, 212, 191, 0.22), inset 0 0 25px rgba(45, 212, 191, 0.18);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: all 0.4s ease;
    }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(94, 234, 212, 0.25);
    }
    .r1 { width: 74%; height: 74%; }
    .r2 { width: 48%; height: 48%; }
    .r3 { width: 22%; height: 22%; }
    .cross-h { position: absolute; width: 100%; height: 1px; background: rgba(94, 234, 212, 0.22); }
    .cross-v { position: absolute; width: 1px; height: 100%; background: rgba(94, 234, 212, 0.22); }
    .center-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #99f6e4;
      border-radius: 50%;
      box-shadow: 0 0 8px #5eead4;
    }
    .sweep {
      position: absolute;
      width: 50%;
      height: 50%;
      top: 0;
      left: 50%;
      transform-origin: bottom left;
      background: conic-gradient(from 0deg, rgba(94, 234, 212, 0.65) 0deg, rgba(45, 212, 191, 0.15) 45deg, transparent 75deg);
      animation: rotateRadar 3.6s linear infinite;
    }
    .radar-box.active-fast {
      border-color: #38bdf8;
      box-shadow: 0 0 42px rgba(56, 189, 248, 0.45), inset 0 0 25px rgba(56, 189, 248, 0.3);
    }
    .radar-box.active-fast .sweep {
      animation: rotateRadar 0.85s linear infinite;
    }
    @keyframes rotateRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* VREMENSKA IKONA U KUTU RADARA */
    .weather-badge-icon {
      position: absolute;
      bottom: -4px;
      right: 6px;
      font-size: 4.1rem;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.75));
      z-index: 5;
      transition: transform 0.3s ease;
    }

    /* 4 KARTICE SA SENZORIMA */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }
    .sensor-card {
      background: linear-gradient(145deg, rgba(22, 38, 58, 0.85), rgba(12, 23, 38, 0.92));
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 500;
    }
    .card-mini-icon {
      font-size: 1.05rem;
      color: #38bdf8;
      opacity: 0.9;
    }
    .card-value {
      font-size: 1.55rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.3px;
    }
    .card-value span {
      font-size: 0.95rem;
      font-weight: 500;
      color: #94a3b8;
    }

    /* TRAKA ZA PROGNOZU */
    .forecast-bar {
      width: 100%;
      background: linear-gradient(90deg, rgba(14, 116, 144, 0.28), rgba(22, 78, 99, 0.45), rgba(14, 116, 144, 0.28));
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.15);
    }
    .forecast-bar.alert {
      border-color: rgba(248, 113, 113, 0.65);
      background: linear-gradient(90deg, rgba(127, 29, 29, 0.4), rgba(153, 27, 27, 0.55), rgba(127, 29, 29, 0.4));
    }
    .forecast-text {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #e0f2fe;
      text-transform: uppercase;
      text-align: center;
    }

    /* CRVENI DEMO GUMB */
    .demo-button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(180deg, #ff5238 0%, #d92616 100%);
      color: #ffffff;
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(220, 38, 38, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.35);
      transition: transform 0.12s ease, filter 0.2s ease;
    }
    .demo-button:active { transform: scale(0.97); }
    .demo-button:disabled { filter: grayscale(0.35); opacity: 0.75; cursor: not-allowed; }

    .sync-info {
      font-size: 0.72rem;
      color: #64748b;
      margin-top: -6px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- RADAR -->
    <div class="radar-section">
      <div id="radarBox" class="radar-box">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="cross-h"></div>
        <div class="cross-v"></div>
        <div class="sweep"></div>
        <div class="center-dot"></div>
      </div>
      <div id="weatherIcon" class="weather-badge-icon">☀️</div>
    </div>

    <!-- KARTICE PODATAKA -->
    <div class="cards-grid">
      <div class="sensor-card">
        <div class="card-top">
          <span class="card-title">Temperatura</span>
          <span class="card-mini-icon">🌡️</span>
        </div>
        <div class="card-value"><span id="valTemp" style="font-size:1.55rem;color:#38bdf8;font-weight:700;">--</span> <span>°C</span></div>
      </div>

      <div class="sensor-card">
        <div class="card-top">
          <span class="card-title">Vlaga</span>
          <span class="card-mini-icon">💧</span>
        </div>
        <div class="card-value"><span id="valHum" style="font-size:1.55rem;color:#38bdf8;font-weight:700;">--</span> <span>%</span></div>
      </div>

      <div class="sensor-card">
        <div class="card-top">
          <span class="card-title">Tlak</span>
          <span class="card-mini-icon">⏱️</span>
        </div>
        <div class="card-value"><span id="valPress" style="font-size:1.55rem;color:#38bdf8;font-weight:700;">--</span> <span>hPa</span></div>
      </div>

      <div class="sensor-card">
        <div class="card-top">
          <span class="card-title">Svjetlost</span>
          <span class="card-mini-icon">☀️</span>
        </div>
        <div class="card-value"><span id="valLight" style="font-size:1.55rem;color:#38bdf8;font-weight:700;">--</span> <span>lx</span></div>
      </div>
    </div>

    <!-- STATUS / PROGNOZA -->
    <div id="forecastBar" class="forecast-bar">
      <span>📡</span>
      <div id="forecastText" class="forecast-text">POVEZIVANJE SA STANICOM...</div>
    </div>

    <!-- DEMO GUMB -->
    <button id="demoBtn" class="demo-button" onclick="aktivirajDemo()">POKRENI DEMO RADAR</button>
    <div id="syncInfo" class="sync-info">Podaci uživo s tvoje Meteo postaje</div>
  </div>

  <script>
    const BLYNK_TOKEN = "Vd2d3Wp2gLyTIePEgPuxW4iCYe_rynZM";
    const API_URL = "https://blynk.cloud";

    async function osvjeziStanicu() {
      try {
        const odgovor = await fetch(`${API_URL}/get?token=${BLYNK_TOKEN}&V0&V1&V2&V3&V4`);
        if (!odgovor.ok) throw new Error("Mreža nedostupna");
        const podaci = await odgovor.json();

        document.getElementById("valTemp").textContent = parseFloat(podaci.V0).toFixed(1);
        document.getElementById("valHum").textContent = Math.round(podaci.V1);
        document.getElementById("valPress").textContent = parseFloat(podaci.V2).toFixed(1);
        document.getElementById("valLight").textContent = Math.round(podaci.V3);

        const status = String(podaci.V4 || "ONLINE").toUpperCase();
        const radarBox = document.getElementById("radarBox");
        const weatherIcon = document.getElementById("weatherIcon");
        const forecastBar = document.getElementById("forecastBar");
        const forecastText = document.getElementById("forecastText");

        forecastText.textContent = "PROGNOZA: " + status;

        if (status.includes("KISA") || status.includes("UPOZORENJE") || status.includes("DEMO")) {
          weatherIcon.textContent = "🌧️";
          forecastBar.classList.add("alert");
          if (status.includes("VRTI") || status.includes("DEMO") || status.includes("UPOZORENJE") || status.includes("AKTIVAN")) {
            radarBox.classList.add("active-fast");
          } else {
